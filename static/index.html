<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>職業パス探索</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root { --navy:#1c2b4a; --grey:#7a8aa0; --cyan:#00d2e8; --bg:#f4f8fb; --nope:#e0674f; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--navy); overflow:hidden;
         font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Meiryo",system-ui,sans-serif; }
  .app { height:100%; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }
  .stage { flex:1; position:relative; width:min(88vw,440px); margin:1.2rem auto .5rem; min-height:0; }
  .card-s { position:absolute; inset:0; background:#fff; border-radius:28px; overflow:hidden;
            box-shadow:0 12px 32px rgba(28,43,74,.12); display:flex; flex-direction:column;
            touch-action:pan-y; user-select:none; will-change:transform; cursor:pointer; }
  .card-s.back { pointer-events:none; box-shadow:0 6px 16px rgba(28,43,74,.08); }
  .card-s.b1 { transform:rotate(-2.2deg) translateY(-6px) scale(.97); }
  .card-s.b2 { transform:rotate(1.8deg) translateY(-3px) scale(.98); }
  .photo { flex:0 0 62%; background:linear-gradient(135deg,#9fdbe6,#5aa9c9); position:relative; }
  .photo img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .text { flex:1; padding:1.1rem 1.5rem; overflow:hidden; }
  .text h2 { font-size:clamp(1.05rem,4.6vw,1.5rem); line-height:1.5; font-weight:700; margin:0 0 .5rem; }
  .text p { font-size:clamp(.85rem,3.6vw,1rem); line-height:1.8; color:var(--grey); margin:0; }
  .stamp { position:absolute; top:1.2rem; padding:.2rem .8rem; border:3px solid; border-radius:12px;
           font-weight:700; font-size:1.3rem; opacity:0; background:#fffc; }
  .stamp.like { left:1rem; color:var(--cyan); transform:rotate(-10deg); }
  .stamp.nope { right:1rem; color:var(--nope); transform:rotate(10deg); }
  .actions { display:flex; justify-content:center; align-items:flex-start; gap:1.2rem; padding:.4rem 0 1rem; }
  .act { display:flex; flex-direction:column; align-items:center; gap:.5rem; width:84px; font-size:.85rem; }
  .round { width:64px; height:64px; border-radius:50%; border:0; background:#fff; display:grid; place-items:center;
           box-shadow:0 8px 20px rgba(28,43,74,.12); color:var(--grey); }
  .round.yes { color:var(--cyan); }
  .act.no span { color:var(--grey); } .act.yes span { color:var(--cyan); }
  .more { flex:0 1 230px; height:54px; margin-top:5px; border:1.5px solid var(--cyan); background:#fff; color:var(--navy);
          border-radius:999px; display:flex; align-items:center; justify-content:center; gap:.6rem; font-size:1rem; }
  .more svg { color:var(--cyan); }
  .round:active, .more:active { transform:scale(.95); }
  button:focus-visible { outline:3px solid var(--navy); outline-offset:2px; }
  nav { display:flex; justify-content:space-around; background:#fff; border-top:1px solid #e6edf3;
        padding:.55rem 0 calc(.55rem + env(safe-area-inset-bottom)); }
  nav button { background:none; border:0; display:flex; flex-direction:column; align-items:center; gap:.25rem;
               font-size:clamp(.58rem,2.6vw,.7rem); white-space:nowrap; color:var(--grey); flex:1; cursor:default; }
  nav button.active { color:var(--cyan); }
  nav button.live { cursor:pointer; }
  #storyModal .modal-dialog, #bubbleModal .modal-dialog, #visionModal .modal-dialog { max-width:min(88vw,440px); margin-left:auto; margin-right:auto; }
  #storyModal .modal-content, #bubbleModal .modal-content, #visionModal .modal-content { border:0; border-radius:28px; overflow:hidden; display:flex; flex-direction:column;
                               max-height:calc(100vh - 2rem); max-height:calc(100dvh - 2rem); }
  #mBody { flex:1 1 auto; min-height:0; overflow-y:auto; }
  .m-close { position:absolute; top:.8rem; right:.8rem; z-index:5; width:2rem; height:2rem; padding:0;
             background-color:#fffd; border-radius:50%; background-size:.8rem; opacity:1; }
  .m-photo { aspect-ratio:4/3; background:linear-gradient(135deg,#9fdbe6,#5aa9c9); }
  .m-photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .m-text { padding:1.2rem 1.5rem 1.5rem; }
  .m-text h2 { font-size:clamp(1.05rem,4.6vw,1.5rem); line-height:1.5; font-weight:700; margin:0 0 .6rem; }
  .m-abs { color:var(--grey); line-height:1.8; margin-bottom:1rem; }
  #mStory p { line-height:1.9; margin-bottom:.9rem; }
  .m-foot { flex-direction:column; align-items:stretch; gap:.6rem; border-top:1px solid #e6edf3;
            padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom)); }
  .m-ask { margin:0; text-align:center; font-size:.8rem; color:var(--grey); }
  .m-choices { display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; width:100%; }
  .m-btn { border:1.5px solid #d5dee8; background:#fff; color:var(--navy); border-radius:999px; padding:.65rem 0; font-size:.95rem; }
  .m-btn.nope { color:var(--nope); border-color:#f0c4bb; }
  .m-btn.primary { background:var(--cyan); border-color:var(--cyan); font-weight:700; }
  .m-btn:active { transform:scale(.96); }
  .done { text-align:center; padding:2rem 1rem; }
  .m-view { display:flex; flex-direction:column; gap:.7rem; width:100%; }
  .m-view[hidden] { display:none; }
  .m-q { margin:0; font-size:1.05rem; font-weight:700; text-align:center; }
  .m-chips { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; }
  .chip { border:1.5px solid var(--cyan); background:#fff; color:var(--navy); border-radius:999px; padding:.65rem .4rem; font-size:.9rem; }
  .chip[aria-pressed="true"] { background:var(--cyan); font-weight:700; }
  .m-reason-actions { display:flex; align-items:center; justify-content:space-between; gap:.8rem; margin-top:.2rem; }
  .m-skip { background:none; border:0; color:#0a9fb2; font-size:.9rem; padding:.4rem 0; text-align:left; }
  .m-done { padding-left:2rem; padding-right:2rem; }
  .m-done:disabled { opacity:.4; }
  .m-sec { font-size:1.15rem; font-weight:700; margin:1.4rem 0 .8rem; }
  .tl { list-style:none; margin:0; padding:0; }
  .tl-item { display:grid; grid-template-columns:3.4rem 14px 1fr; column-gap:.6rem; }
  .tl-time, .tl-act { padding-bottom:1.1rem; line-height:1.7; font-size:.95rem; }
  .tl-time { font-weight:700; font-variant-numeric:tabular-nums; }
  .tl-act { color:#3d4b58; }
  .tl-dot { position:relative; }
  .tl-dot::before { content:""; position:absolute; left:50%; top:.6rem; bottom:-.1rem; width:2px; background:#dbe5ee; transform:translateX(-50%); }
  .tl-dot::after { content:""; position:absolute; left:50%; top:.5rem; width:10px; height:10px; border-radius:50%; background:#b9c9d8; transform:translateX(-50%); }
  .tl-item:last-child .tl-dot::before { display:none; }
  .tl-item:last-child .tl-time, .tl-item:last-child .tl-act { padding-bottom:0; }
  .home-view { flex:1; display:flex; flex-direction:column; min-height:0; }
  .map-view { flex:1; min-height:0; position:relative; }
  .home-view[hidden], .map-view[hidden] { display:none; }
  .map-area { position:absolute; top:.5rem; bottom:.5rem; left:50%; width:min(92vw,440px); transform:translateX(-50%); }
  .bubble { position:absolute; box-sizing:border-box; border:0; border-radius:50%; padding:0; display:flex; align-items:center; justify-content:center;
            text-align:center; line-height:1.3; font-weight:700; cursor:pointer; transition:transform .15s;
            animation:pop .5s cubic-bezier(.2,.9,.3,1.2) backwards; }
  .bubble span { display:block; max-width:84%; overflow-wrap:anywhere; }
  .bubble:active { transform:scale(.95); }
  .bubble.main { background:#00e8f8; color:var(--navy); box-shadow:0 0 40px rgba(0,232,248,.55); }
  .bubble.pos { background:#3fe0ec; color:var(--navy); box-shadow:0 0 18px rgba(0,210,232,.35); }
  .bubble.exp { background:#c9cdd2; color:var(--navy); }
  .bubble.neg { background:#3a3d42; color:#fff; }
  @keyframes pop { from { opacity:0; transform:scale(.6); } to { opacity:1; transform:scale(1); } }
  .ex-body { padding:3.2rem 1.5rem 1.5rem; overflow-y:auto; }
  .b-title { font-size:1.45rem; font-weight:700; text-align:center; margin:0 0 .9rem; }
  .b-text { line-height:1.9; text-align:center; margin:0 0 1.2rem; }
  .b-btn { display:block; width:100%; border:0; border-radius:12px; padding:.95rem; font-weight:700; font-size:1rem; margin-top:.7rem; color:var(--navy); }
  .b-primary { background:#00e8f8; } .b-grey { background:#cbd0d6; }
  .heart-fx { position:fixed; z-index:2000; pointer-events:none; color:var(--cyan); line-height:1;
              animation:heartUp .8s ease-out both; }
  @keyframes heartUp {
    0% { opacity:0; transform:translate(-50%,-50%) scale(.4); }
    15% { opacity:1; }
    100% { opacity:0; transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); }
  }
  .bye-fx { position:fixed; z-index:2000; pointer-events:none; line-height:1; font-size:34px; opacity:0;
            animation:byeWave 1s ease-in-out both; }
  @keyframes byeWave {
    0% { opacity:0; transform:translate(-50%,-50%) rotate(0) scale(.6); }
    12% { opacity:1; transform:translate(-50%,-50%) rotate(0) scale(1); }
    28% { opacity:1; transform:translate(-50%,-50%) rotate(25deg); }
    43% { transform:translate(-50%,-50%) rotate(-20deg); }
    58% { transform:translate(-50%,-50%) rotate(22deg); }
    73% { opacity:1; transform:translate(-50%,-55%) rotate(-14deg); }
    100% { opacity:0; transform:translate(-50%,-95%) rotate(0) scale(.9); }
  }
  .vision-view { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .vision-view[hidden] { display:none; }
  .vision-inner { width:min(92vw,440px); margin:0 auto; padding:1.2rem 0 1.5rem; }
  .v-h { font-size:1.25rem; font-weight:700; margin:0 0 .3rem; }
  .v-lead { color:var(--grey); font-size:.9rem; margin:0 0 1rem; }
  .v-card { background:#fff; border-radius:22px; padding:1.2rem 1.3rem; margin-bottom:1rem; box-shadow:0 8px 24px rgba(28,43,74,.1); }
  .v-no { width:1.7rem; height:1.7rem; border-radius:50%; background:var(--cyan); color:var(--navy); font-weight:700;
          display:grid; place-items:center; font-size:.9rem; margin-bottom:.5rem; }
  .v-title { font-size:1.2rem; font-weight:700; margin:0 0 .5rem; }
  .v-reason { color:#3d4b58; line-height:1.8; font-size:.95rem; margin:0 0 .7rem; }
  .v-tags { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:.8rem; }
  .v-tags span { border:1.5px solid var(--cyan); border-radius:999px; padding:.15rem .7rem; font-size:.78rem; }
  .v-sub { font-size:.9rem; font-weight:700; margin:.4rem 0 .3rem; }
  .v-skills { list-style:none; margin:0; padding:0; }
  .v-skills li { padding:.7rem 0; border-top:1px solid #e6edf3; }
  .v-skills b { display:block; margin-bottom:.15rem; }
  .v-skills span { display:block; color:var(--grey); font-size:.88rem; line-height:1.7; }
  .v-summary { color:#3d4b58; line-height:1.7; font-size:.95rem; margin:0 0 .8rem; }
  .v-card { display:flex; align-items:center; gap:.8rem; }
  .v-body { flex:1; min-width:0; }
  .v-body .v-summary { margin:0; }
  .v-body .v-tags { margin:.7rem 0 0; }
  .v-skillnames { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; margin-top:.7rem; }
  .v-skillnames .v-lbl { width:100%; font-size:.75rem; font-weight:700; color:var(--grey); }
  .v-skillnames span:not(.v-lbl) { background:#eaf0f5; color:var(--navy); border-radius:8px; padding:.15rem .6rem; font-size:.78rem; }
  .v-go { flex:0 0 auto; width:2.6rem; height:2.6rem; border:0; border-radius:50%; background:var(--cyan); color:var(--navy);
          display:grid; place-items:center; box-shadow:0 4px 12px rgba(0,210,232,.35); }
  .v-go:active { transform:scale(.93); }
  #vmBody .v-title { font-size:1.45rem; }
  #vmBody .v-sub { font-size:1.05rem; margin:1.3rem 0 .5rem; }
  .v-msg { text-align:center; padding:4rem 1rem; }
  .toast-fx { position:fixed; left:50%; bottom:calc(5.5rem + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:2000;
              background:var(--navy); color:#fff; padding:.5rem 1.1rem; border-radius:999px; font-size:.9rem; pointer-events:none;
              animation:toastFade 1.6s ease both; }
  @keyframes toastFade { 0% { opacity:0; } 12%, 80% { opacity:1; } 100% { opacity:0; } }
  .settings-view { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .settings-view[hidden] { display:none; }
  .settings-inner { width:min(92vw,440px); margin:0 auto; padding:1.2rem 0 1.5rem; }
  .set-card { background:#fff; border-radius:22px; padding:1.1rem 1.3rem; margin-bottom:1rem; box-shadow:0 8px 24px rgba(28,43,74,.1); }
  .set-t { font-size:1rem; font-weight:700; margin:0 0 .6rem; display:flex; justify-content:space-between; align-items:baseline; }
  .set-t .count { font-size:.8rem; font-weight:400; color:var(--grey); }
  .set-sub { font-size:.85rem; font-weight:700; margin:.9rem 0 .4rem; }
  .set-note { font-size:.78rem; color:var(--grey); margin:.6rem 0 0; line-height:1.6; }
  .set-input { border-radius:12px; border:1.5px solid #d5dee8; padding:.6rem .8rem; }
  .set-input:focus { border-color:var(--cyan); box-shadow:0 0 0 .2rem rgba(0,210,232,.2); }
  .seg { display:flex; gap:.6rem; }
  .seg label { flex:1; margin:0; position:relative; }
  .seg input { position:absolute; opacity:0; pointer-events:none; }
  .seg span { display:block; text-align:center; border:1.5px solid #d5dee8; border-radius:999px; padding:.55rem 0; background:#fff; cursor:pointer; }
  .seg input:checked + span { background:var(--cyan); border-color:var(--cyan); font-weight:700; }
  .seg label.no input:checked + span { background:#3a3d42; border-color:#3a3d42; color:#fff; }
  .seg input:focus-visible + span { outline:3px solid var(--navy); outline-offset:2px; }
  .add-row { display:flex; gap:.5rem; }
  .btn-add { flex:0 0 auto; border:1.5px solid var(--cyan); background:#fff; color:var(--navy); border-radius:12px; padding:0 1rem; font-weight:700; }
  .btn-add:disabled, .add-row input:disabled { opacity:.45; }
  .chip-list { display:flex; flex-wrap:wrap; gap:.4rem; margin-top:.7rem; }
  .chip-list:empty { display:none; }
  .kchip { display:inline-flex; align-items:center; gap:.2rem; border-radius:999px; padding:.15rem .3rem .15rem .8rem; font-size:.85rem; border:1.5px solid var(--cyan); }
  .kchip.no { background:#3a3d42; border-color:#3a3d42; color:#fff; }
  .kchip button { border:0; background:none; color:inherit; width:1.5rem; height:1.5rem; border-radius:50%; font-size:1.05rem; line-height:1; }
  .set-msg { margin:.8rem 0 0; text-align:center; font-size:.9rem; min-height:1.3rem; }
  .set-msg.err { color:var(--nope); }
  @media (prefers-reduced-motion:reduce){ .card-s{ transition:none !important; } .bubble, .heart-fx, .bye-fx{ animation:none; opacity:0; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z" fill="currentColor"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2zM12 6v14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M15.5 8.5l-2 5-5 2 2-5z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></symbol>
</svg>

<div class="app">
  <div class="home-view" id="homeView">
  <div class="stage" id="stage"></div>
  <div class="actions" id="actions">
    <div class="act no"><button class="round" id="btnNo" aria-label="興味なし（左矢印キー）"><svg width="30" height="30"><use href="#i-x"/></svg></button><span>興味なし</span></div>
    <button class="more" id="btnMore"><svg width="26" height="26"><use href="#i-book"/></svg>続きを読む</button>
    <div class="act yes"><button class="round yes" id="btnYes" aria-label="気になる（右矢印キー）"><svg width="34" height="34"><use href="#i-heart"/></svg></button><span>気になる</span></div>
  </div>
  </div>
  <section class="map-view" id="mapView" hidden aria-label="職業探索マップ"><div class="map-area" id="mapArea"></div></section>
  <section class="vision-view" id="visionView" hidden aria-label="キャリアビジョン"><div class="vision-inner" id="visionInner"></div></section>
  <section class="settings-view" id="settingsView" hidden aria-label="設定"><div class="settings-inner">
    <h2 class="v-h">設定</h2><p class="v-lead">あなたの情報を入力すると、次に選ばれるカードに反映されます。</p>
    <div class="set-card">
      <h3 class="set-t">専攻（専門分野）</h3>
      <input id="majorInput" class="form-control set-input" maxlength="30" placeholder="例：情報工学" autocomplete="off" aria-label="専攻">
      <p class="set-sub">専攻への気持ちは？</p>
      <div class="seg" role="radiogroup" aria-label="専攻への態度">
        <label><input type="radio" name="attitude" value="like"><span>好き</span></label>
        <label class="no"><input type="radio" name="attitude" value="dislike"><span>苦手</span></label>
      </div>
      <p class="set-note">「好き」なら好みのキーワード、「苦手」なら避けたいキーワードに追加されます。</p>
    </div>
    <div class="set-card" id="likeBox">
      <h3 class="set-t">好き・気になるキーワード<span class="count"></span></h3>
      <div class="add-row"><input class="form-control set-input" maxlength="30" placeholder="キーワードを入力" aria-label="好き・気になるキーワード" autocomplete="off"><button type="button" class="btn-add">追加</button></div>
      <div class="chip-list"></div>
    </div>
    <div class="set-card" id="dislikeBox">
      <h3 class="set-t">興味がないキーワード<span class="count"></span></h3>
      <div class="add-row"><input class="form-control set-input" maxlength="30" placeholder="キーワードを入力" aria-label="興味がないキーワード" autocomplete="off"><button type="button" class="btn-add">追加</button></div>
      <div class="chip-list"></div>
    </div>
    <button type="button" class="b-btn b-primary" id="btnSave">保存する</button>
    <p class="set-msg" id="setMsg" role="status"></p>
  </div></section>
  <nav>
    <button type="button" class="active live" id="navHome" aria-current="page"><svg width="28" height="28"><use href="#i-home"/></svg>ホーム</button>
    <button type="button" class="live" id="navMap"><svg width="28" height="28"><use href="#i-map"/></svg>職業探索マップ</button>
    <button type="button" class="live" id="navVision"><svg width="28" height="28"><use href="#i-compass"/></svg>キャリアビジョン</button>
    <button type="button" class="live" id="navSettings"><svg width="28" height="28"><use href="#i-user"/></svg>設定</button>
  </nav>
</div>

<div class="modal fade" id="storyModal" tabindex="-1" aria-labelledby="mTitle">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <button type="button" class="btn-close m-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
      <div class="modal-body p-0" id="mBody">
        <div class="m-photo" id="mImg"></div>
        <div class="m-text"><h2 id="mTitle"></h2><p class="m-abs" id="mAbs"></p><div id="mStory"></div></div>
      </div>
      <div class="modal-footer m-foot">
        <div class="m-view" id="viewChoice">
          <p class="m-ask">この職業にどのくらい興味がありますか？</p>
          <div class="m-choices">
            <button type="button" class="m-btn nope" data-choice="detail_nope">興味なし</button>
            <button type="button" class="m-btn" data-choice="detail_neutral">普通</button>
            <button type="button" class="m-btn primary" data-choice="detail_like">気になる</button>
          </div>
        </div>
        <div class="m-view" id="viewReason" hidden>
          <p class="m-q">何があなたを惹きつけましたか？</p>
          <div class="m-chips" id="mChips"></div>
          <div class="m-reason-actions">
            <button type="button" class="m-skip" id="btnSkip">ちょっと気になっただけ</button>
            <button type="button" class="m-btn primary m-done" id="btnDone" disabled>完了</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="bubbleModal" tabindex="-1" aria-labelledby="bTitle">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <button type="button" class="btn-close m-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
      <div class="ex-body">
        <h2 class="b-title" id="bTitle"></h2>
        <p class="b-text" id="bText"></p>
        <button type="button" class="b-btn b-primary" data-act="explore">この傾向をもっと探る</button>
        <button type="button" class="b-btn b-grey" data-act="escape">ちょっと違うかも</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="visionModal" tabindex="-1" aria-labelledby="vmTitle">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <button type="button" class="btn-close m-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
      <div class="ex-body" id="vmBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let careers = [], idx = 0, busy = false, liked = [];
const stage = document.getElementById('stage');
const modal = new bootstrap.Modal('#storyModal');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function cardHTML(c) {
  return `<div class="photo"><img src="/images/${c.image}" alt="" draggable="false" onerror="this.remove()">
    <div class="stamp like">気になる</div><div class="stamp nope">興味なし</div></div>
    <div class="text"><h2>${esc(c.title)}</h2><p>${esc(c.abstract)}</p></div>`;
}

function render() {
  stage.innerHTML = '';
  if (idx >= careers.length) return showDone();
  document.getElementById('actions').style.visibility = 'visible';
  if (careers[idx + 1]) stage.insertAdjacentHTML('beforeend', '<div class="card-s back b1"></div>');
  if (careers[idx + 2]) stage.insertAdjacentHTML('beforeend', '<div class="card-s back b2"></div>');
  const el = document.createElement('div'); el.className = 'card-s'; el.innerHTML = cardHTML(careers[idx]);
  stage.appendChild(el); attachDrag(el);
}

function attachDrag(el) {
  let sx = 0, dx = 0, drag = false;
  const like = el.querySelector('.stamp.like'), nope = el.querySelector('.stamp.nope');
  el.addEventListener('pointerdown', e => { if (busy) return; drag = true; dx = 0; sx = e.clientX; el.style.transition = 'none'; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => {
    if (!drag) return; dx = e.clientX - sx;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    like.style.opacity = Math.max(0, dx / 100); nope.style.opacity = Math.max(0, -dx / 100);
  });
  el.addEventListener('pointerup', () => {
    if (!drag) return; drag = false;
    if (Math.abs(dx) < 6) { openStory(); }               // タップ = 「続きを読む」と同じ
    else if (Math.abs(dx) > 100) { decide(dx > 0 ? 'swipe_like' : 'swipe_nope'); }
    else { el.style.transition = 'transform .25s'; el.style.transform = ''; like.style.opacity = nope.style.opacity = 0; }
    dx = 0;
  });
  el.addEventListener('pointercancel', () => {
    if (!drag) return; drag = false; dx = 0;
    el.style.transition = 'transform .25s'; el.style.transform = ''; like.style.opacity = nope.style.opacity = 0;
  });
}

const FLY = { swipe_like:'right', detail_like:'right', swipe_nope:'left', detail_nope:'left' };
let modalAction = null, modalKeywords = [], pendingKw = [];

function scheduleHTML(list) {
  if (!Array.isArray(list) || !list.length) return '';       // 時間点の数は職業ごとに自由
  return '<h3 class="m-sec">1日のスケジュール</h3><ol class="tl">' + list.map(s =>
    `<li class="tl-item"><span class="tl-time">${esc(s.time)}</span><span class="tl-dot" aria-hidden="true"></span><span class="tl-act">${esc(s.activity)}</span></li>`
  ).join('') + '</ol>';
}

function showView(name) {
  document.getElementById('viewChoice').hidden = name !== 'choice';
  document.getElementById('viewReason').hidden = name !== 'reason';
}

function openStory() {
  const c = careers[idx]; if (!c || busy) return;
  modalAction = null; modalKeywords = []; pendingKw = [];
  document.getElementById('mImg').innerHTML = `<img src="/images/${c.image}" alt="" onerror="this.remove()">`;
  document.getElementById('mTitle').textContent = c.title;
  document.getElementById('mAbs').textContent = c.abstract;
  document.getElementById('mStory').innerHTML = c.story.map(p => `<p>${esc(p)}</p>`).join('') + scheduleHTML(c.schedule);
  showView('choice');
  document.getElementById('mBody').scrollTop = 0;
  modal.show();
}

// 「気になる」を押した後：その職業の feature から理由を選んでもらう
function showReason(c) {
  const box = document.getElementById('mChips'), done = document.getElementById('btnDone');
  box.innerHTML = c.feature.map(k => `<button type="button" class="chip" aria-pressed="false">${esc(k)}</button>`).join('');
  done.disabled = true; pendingKw = [];
  box.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true');
    pendingKw = [...box.querySelectorAll('.chip[aria-pressed="true"]')].map(x => x.textContent);
    done.disabled = !pendingKw.length;
  });
  showView('reason');
}

document.querySelectorAll('[data-choice]').forEach(b => b.onclick = () => {
  modalAction = b.dataset.choice;
  if (modalAction === 'detail_like') heartBurst(b);
  if (modalAction === 'detail_nope') byeBurst(b);
  const c = careers[idx];
  if (modalAction === 'detail_like' && Array.isArray(c.feature) && c.feature.length) showReason(c);
  else modal.hide();
});
document.getElementById('btnSkip').onclick = () => { modalKeywords = []; modal.hide(); };   // ちょっと気になっただけ：記録なし
document.getElementById('btnDone').onclick = () => { modalKeywords = pendingKw; modal.hide(); };

// 閉じた時に確定。何も押さずに閉じたら detail_exit
document.getElementById('storyModal').addEventListener('hidden.bs.modal', () => {
  const action = modalAction || 'detail_exit', c = careers[idx];
  if (c && action === 'detail_like' && modalKeywords.length)
    fetch('/api/keywords', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ career_id: c.id, keywords: modalKeywords }) }).catch(console.error);
  modalAction = null; modalKeywords = []; pendingKw = [];
  decide(action);
});

function decide(action) {
  if (busy || idx >= careers.length) return; busy = true; mapDirty = true;
  if (action === 'swipe_like') heartBurst(document.getElementById('btnYes'));
  if (action === 'swipe_nope') byeBurst(document.getElementById('btnNo'));
  const c = careers[idx], el = stage.querySelector('.card-s:not(.back)'), dir = FLY[action];
  el.style.transition = 'transform .35s, opacity .35s';
  el.style.transform = dir ? `translateX(${dir === 'right' ? 600 : -600}px) rotate(${dir === 'right' ? 25 : -25}deg)`
                           : 'translateY(-60px) scale(.96)';
  el.style.opacity = 0;
  const saved = fetch('/api/swipes', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ career_id: c.id, action }) })
    .then(r => r.json()).then(d => { if (d.score > 0) liked.push(c); }).catch(console.error);
  Promise.all([saved, new Promise(r => setTimeout(r, 300))]).then(() => { idx++; busy = false; render(); });
}

function showDone() {
  document.getElementById('actions').style.visibility = 'hidden';
  stage.innerHTML = `<div class="text-center pt-5"><h2 class="h4">すべてのストーリーを見ました</h2>
    <p class="text-secondary mt-3">${liked.length ? '気になる職業：' : '気になる職業はありませんでした。'}</p>
    <ul class="list-unstyled">${liked.map(c => `<li class="mb-2">${esc(c.title)}</li>`).join('')}</ul>
    <button class="btn btn-outline-info rounded-pill px-4" onclick="newBatch()">もう一度見る</button></div>`;
}

document.getElementById('btnNo').onclick = () => decide('swipe_nope');
document.getElementById('btnYes').onclick = () => decide('swipe_like');
document.getElementById('btnMore').onclick = openStory;
document.addEventListener('keydown', e => {
  if (document.querySelector('.modal.show')) return;
  if (e.key === 'ArrowLeft') decide('swipe_nope');
  if (e.key === 'ArrowRight') decide('swipe_like');
});

// ---- 「気になる」を押した時のハートが浮かぶ演出（約1秒）----
function heartBurst(el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 8; i++) {
    const s = document.createElement('span'); s.className = 'heart-fx'; s.textContent = '♥';
    s.style.cssText = `left:${cx}px;top:${cy}px;font-size:${12 + Math.random() * 14}px;opacity:0;` +
      `color:${i % 2 ? '#00d2e8' : '#3fe0ec'};--dx:${(Math.random() - .5) * 90}px;--dy:${-(70 + Math.random() * 60)}px;animation-delay:${i * 40}ms`;
    document.body.appendChild(s); s.addEventListener('animationend', () => s.remove());
  }
}

// ---- 職業探索マップ（バブル表示）----
let mapData = null, mapDirty = true, mapLoading = false, bubbleCurrent = null;
const settingsView = document.getElementById('settingsView'), visionView = document.getElementById('visionView'), homeView = document.getElementById('homeView'), mapView = document.getElementById('mapView'), mapArea = document.getElementById('mapArea');
const bubbleModal = new bootstrap.Modal('#bubbleModal');

// <layout>
const BUBBLE_SIZE = { main: .40, pos: .25, exp: .235, neg: .25 };   // 基準長さ u に対する直径の比
function relax(nodes, W, H) {                                         // d3 が読み込めない時の簡易版
  for (let t = 0; t < 400; t++) {
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const p = nodes[i], q = nodes[j];
      let dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy);
      if (d < .01) { dx = 1; dy = 0; d = 1; }
      const min = p.r + q.r + 8;
      if (d < min) {
        const push = min - d, wp = p.kind === 'main' ? 0 : q.kind === 'main' ? 1 : .5, wq = q.kind === 'main' ? 0 : p.kind === 'main' ? 1 : .5;
        p.x -= dx / d * push * wp; p.y -= dy / d * push * wp; q.x += dx / d * push * wq; q.y += dy / d * push * wq;
      }
    }
    nodes.forEach(n => clampNode(n, W, H));
  }
}
function clampNode(n, W, H) {
  n.x = Math.min(W - n.r - 4, Math.max(n.r + 4, n.x)); n.y = Math.min(H - n.r - 4, Math.max(n.r + 4, n.y));
}
function layoutOnce(items, W, H, scale) {
  const u = Math.min(W, H * 0.65) * scale, cx = W / 2, cy = H / 2, rad = d => d * Math.PI / 180;
  const nodes = items.map(it => ({ ...it, r: u * BUBBLE_SIZE[it.kind] / 2 }));
  const of = k => nodes.filter(n => n.kind === k);
  const edge = a => 1 / Math.hypot(Math.cos(a) / (W / 2 - 10), Math.sin(a) / (H / 2 - 10));   // 中心から端までの距離
  const main = of('main')[0], r0 = main ? main.r : 0;
  // 種類ごとの「中心からの狙い距離」: 積極=すぐ外側 / 探索=中間 / 消極=いちばん遠く
  const dist = (n, a) => n.kind === 'pos' ? r0 + n.r + 4
    : n.kind === 'exp' ? Math.max(r0 + u * BUBBLE_SIZE.pos * .8 + n.r, edge(a) * .5) : edge(a) - n.r * .3;
  if (main) { main.x = cx; main.y = cy; }
  const place = (arr, start) => arr.forEach((n, i) => {
    const a = rad(start + i * 360 / arr.length), d = dist(n, a);
    n.x = cx + Math.cos(a) * d; n.y = cy + Math.sin(a) * d;
  });
  place(of('pos'), -70); place(of('exp'), 40); place(of('neg'), 100);
  if (typeof d3 !== 'undefined') {                                  // d3-force: 衝突回避つきの物理シミュレーション
    if (main) { main.fx = cx; main.fy = cy; }
    const ring = alpha => nodes.forEach(n => {                      // 狙い距離へ引き寄せる力
      if (n.kind === 'main') return;
      const a = Math.atan2(n.y - cy, n.x - cx), d = dist(n, a);
      n.vx += (cx + Math.cos(a) * d - n.x) * .2 * alpha; n.vy += (cy + Math.sin(a) * d - n.y) * .2 * alpha;
    });
    const sim = d3.forceSimulation(nodes).force('ring', ring)
      .force('collide', d3.forceCollide(n => n.r + 5).strength(1).iterations(3)).stop();
    for (let t = 0; t < 300; t++) { sim.tick(); nodes.forEach(n => clampNode(n, W, H)); }
  } else relax(nodes, W, H);
  return nodes;
}
function overlaps(nodes) {
  for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++)
    if (Math.hypot(nodes[i].x - nodes[j].x, nodes[i].y - nodes[j].y) < nodes[i].r + nodes[j].r + 2) return true;
  return false;
}
function layoutBubbles(items, W, H) {
  let nodes, s = 1;
  for (let t = 0; t < 6; t++) { nodes = layoutOnce(items, W, H, s); if (!overlaps(nodes)) break; s *= .9; }   // 重なりが残るなら少し小さくして再配置
  return nodes;
}
// </layout>

function bubbleItems(d) {
  const items = [];
  if (d.main_keyword) items.push({ ...d.main_keyword, kind: 'main' });
  (d.other_positive || []).forEach(k => items.push({ ...k, kind: 'pos' }));
  (d.explore || []).forEach(k => items.push({ ...k, kind: 'exp' }));
  (d.negative || []).forEach(k => items.push({ ...k, kind: 'neg' }));
  return items;
}

function renderMap() {
  if (mapView.hidden || !mapData) return;
  const items = bubbleItems(mapData);
  if (!items.length) { mapArea.innerHTML = '<p class="text-center text-secondary pt-5">表示できるキーワードがありませんでした。</p>'; return; }
  const W = mapArea.clientWidth, H = mapArea.clientHeight;
  const nodes = layoutBubbles(items, W, H);
  mapArea.innerHTML = nodes.map((n, i) => {
    const len = n.keyword.length, fs = Math.max(10, n.r * (n.kind === 'main' ? .26 : .3) * (len > 12 ? .75 : len > 8 ? .85 : 1));
    return `<button type="button" class="bubble ${n.kind}" data-i="${i}" style="left:${n.x - n.r}px;top:${n.y - n.r}px;width:${2 * n.r}px;height:${2 * n.r}px;font-size:${fs}px;animation-delay:${i * 50}ms"><span>${esc(n.keyword)}</span></button>`;
  }).join('');
  mapArea.querySelectorAll('.bubble').forEach(b => b.onclick = () => {
    const n = nodes[+b.dataset.i];
    bubbleCurrent = n;
    document.getElementById('bTitle').textContent = n.keyword;
    document.getElementById('bText').textContent = n.justification || n.reason || '';
    bubbleModal.show();
  });
}

function setTab(name) {
  homeView.hidden = name !== 'home'; mapView.hidden = name !== 'map'; visionView.hidden = name !== 'vision'; settingsView.hidden = name !== 'settings';
  [['navHome', 'home'], ['navMap', 'map'], ['navVision', 'vision'], ['navSettings', 'settings']].forEach(([id, t]) => {
    const b = document.getElementById(id); b.classList.toggle('active', t === name);
    if (t === name) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  if (name === 'vision') renderVision();
  if (name === 'settings' && !settingsLoaded) loadSettings();
}

async function showMap() {
  setTab('map');
  if (mapLoading) return;
  if (mapData && !mapDirty) return renderMap();           // 前回の分析から新しい操作がなければ再分析しない
  mapLoading = true; visionState = 'loading'; renderVision();      // マップと一緒にキャリアビジョンも作る
  mapArea.innerHTML = '<div class="text-center pt-5 mt-5"><div class="spinner-border text-info" role="status"></div><p class="mt-3 text-secondary">あなたの好みを分析中…<br>（少し時間がかかります）</p></div>';
  try {
    const r = await fetch('/api/explore/run', { method: 'POST' });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    mapData = d; mapDirty = false; renderMap(); runVision();
  } catch (e) {
    visionState = visionData ? 'ready' : 'none'; renderVision();
    mapArea.innerHTML = `<div class="text-center pt-5 mt-5 px-3"><p class="text-danger">${esc(e.message)}</p><button class="btn btn-outline-info rounded-pill" onclick="showMap()">もう一度</button></div>`;
  } finally { mapLoading = false; }
}

// ---- キャリアビジョン（職種推薦 + スキル開発）----
let visionState = 'none', visionData = null, visionError = '', visionAgain = false;   // none | loading | ready | error
function visionHTML() {
  if (visionState === 'none') return '<div class="v-msg"><p class="fw-bold mb-2">まずは「職業探索マップ」から</p><p class="text-secondary">先に職業探索マップであなたのキーワードを探索してから、キャリアビジョンを見てみましょう。順番に進むと、よりあなたに合った提案が届きます。</p></div>';
  if (visionState === 'loading') return '<div class="v-msg"><div class="spinner-border text-info" role="status"></div><p class="mt-3 text-secondary">キャリアビジョンを作成中…<br>（少し時間がかかります）</p></div>';
  if (visionState === 'error') return `<div class="v-msg"><p class="text-danger">${esc(visionError)}</p><button class="btn btn-outline-info rounded-pill" onclick="runVision()">もう一度</button></div>`;
  const card = (c, i) => `<article class="v-card"><div class="v-body"><div class="v-no">${i + 1}</div><h3 class="v-title">${esc(c.title)}</h3>`
    + (c.summary ? `<p class="v-summary">${esc(c.summary)}</p>` : '')
    + ((c.related_keywords || []).length ? `<div class="v-tags">${c.related_keywords.map(k => `<span>${esc(k)}</span>`).join('')}</div>` : '')
    + ((c.skills || []).length ? `<div class="v-skillnames"><span class="v-lbl">探索したいスキル</span>${c.skills.map(s => `<span>${esc(s.skill)}</span>`).join('')}</div>` : '')
    + '</div>'
    + `<button type="button" class="v-go" data-i="${i}" aria-label="${esc(c.title)}の詳細を見る"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button></article>`;
  return '<h2 class="v-h">あなたのキャリアビジョン</h2><p class="v-lead">キーワードから見えてきた、検討してみたい3つの方向性です。</p>' + visionData.careers.map(card).join('');
}
function renderVision() { if (!visionView.hidden) { document.getElementById('visionInner').innerHTML = visionHTML(); } }
async function runVision() {
  if (visionState === 'loading' && visionBusy) { visionAgain = true; return; }
  visionBusy = true; visionState = 'loading'; renderVision();
  try {
    const r = await fetch('/api/vision/run', { method: 'POST' }), d = await r.json();
    if (!r.ok) throw new Error(d.detail || r.statusText);
    visionData = d; visionState = 'ready';
  } catch (e) { visionState = 'error'; visionError = e.message; }
  visionBusy = false; renderVision();
  if (visionAgain) { visionAgain = false; runVision(); }
}
let visionBusy = false;
const visionModal = new bootstrap.Modal('#visionModal');
function openVision(i) {
  const c = visionData && visionData.careers[i]; if (!c) return;
  const body = document.getElementById('vmBody');
  body.innerHTML = `<h2 class="v-title" id="vmTitle">${esc(c.title)}</h2>` + (c.summary ? `<p class="v-summary">${esc(c.summary)}</p>` : '')
    + `<h3 class="v-sub">お勧め理由</h3><p class="v-reason">${esc(c.reason)}</p>`
    + ((c.related_keywords || []).length ? `<div class="v-tags">${c.related_keywords.map(k => `<span>${esc(k)}</span>`).join('')}</div>` : '')
    + ((c.skills || []).length ? `<h3 class="v-sub">探索したいスキル</h3><ul class="v-skills">${c.skills.map(s => `<li><b>${esc(s.skill)}</b><span>${esc(s.reason)}</span></li>`).join('')}</ul>` : '');
  body.scrollTop = 0; visionModal.show();
}
document.getElementById('visionInner').addEventListener('click', e => {
  const b = e.target.closest('.v-go'); if (b) openVision(+b.dataset.i);
});

// ---- 「興味なし」を押した時の「バイバイ」演出（約1秒）----
function byeBurst(el) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = el.getBoundingClientRect(), s = document.createElement('span');
  s.className = 'bye-fx'; s.textContent = '👋';
  s.style.cssText = `left:${r.left + r.width / 2}px;top:${r.top - 6}px`;
  document.body.appendChild(s); s.addEventListener('animationend', () => s.remove());
}

document.getElementById('navMap').onclick = showMap;
document.getElementById('navVision').onclick = () => setTab('vision');
document.getElementById('navHome').onclick = () => setTab('home');
// ---- 吹き出しの2択: 「この傾向をもっと探る」→ userdefkeywords に+3 / 「ちょっと違うかも」→ escapekeyword.json ----
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast-fx'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1600);
}
document.querySelectorAll('#bubbleModal .b-btn').forEach(b => b.onclick = () => {
  const kw = bubbleCurrent && bubbleCurrent.keyword; if (!kw) return;
  bubbleModal.hide(); toast('記録しました');
  fetch('/api/explore/keyword', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ keyword: kw, action: b.dataset.act }) }).catch(console.error);
});
// ---- 設定: 専攻・態度・キーワード（保存すると userdefkeywords.json / escapekeyword.json に直接反映。LLM不要）----
function chipBox(root, variant) {
  let items = [];
  const list = root.querySelector('.chip-list'), input = root.querySelector('input'), add = root.querySelector('.btn-add'), count = root.querySelector('.count');
  const draw = () => {
    list.innerHTML = items.map((k, i) => `<span class="kchip ${variant}">${esc(k)}<button type="button" data-i="${i}" aria-label="${esc(k)}を削除">×</button></span>`).join('');
    count.textContent = `${items.length} / 10`; input.disabled = add.disabled = items.length >= 10;
  };
  const push = () => {
    const v = input.value.trim().replace(/\s+/g, ' '); input.value = '';
    if (v && !items.includes(v) && items.length < 10) items.push(v);
    draw();
  };
  add.onclick = push;
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); push(); } });   // 日本語変換中のEnterは無視
  list.addEventListener('click', e => { const b = e.target.closest('button'); if (b) { items.splice(+b.dataset.i, 1); draw(); } });
  draw();
  return { get: () => items.slice(), set: v => { items = (v || []).slice(0, 10); draw(); }, flush: push };
}
const likeBox = chipBox(document.getElementById('likeBox'), 'yes'), dislikeBox = chipBox(document.getElementById('dislikeBox'), 'no');
const majorInput = document.getElementById('majorInput'), setMsg = document.getElementById('setMsg');
let settingsLoaded = false;
const showMsg = (t, err) => { setMsg.textContent = t; setMsg.classList.toggle('err', !!err); };
function fillSettings(d) {
  majorInput.value = d.major || '';
  document.querySelectorAll('input[name=attitude]').forEach(r => r.checked = r.value === d.major_attitude);
  likeBox.set(d.like_keywords); dislikeBox.set(d.dislike_keywords);
}
async function loadSettings() {
  try { fillSettings(await (await fetch('/api/profile')).json()); settingsLoaded = true; }
  catch (e) { showMsg('設定を読み込めませんでした。', true); }
}
document.getElementById('btnSave').onclick = async () => {
  likeBox.flush(); dislikeBox.flush();                       // 入力したまま「追加」を押し忘れた分も含める
  const checked = document.querySelector('input[name=attitude]:checked');
  const body = { major: majorInput.value.trim(), major_attitude: checked ? checked.value : '', like_keywords: likeBox.get(), dislike_keywords: dislikeBox.get() };
  if (body.major && !body.major_attitude) return showMsg('専攻への態度（好き / 苦手）を選んでください。', true);
  try {
    const r = await fetch('/api/profile', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) return showMsg(typeof d.detail === 'string' ? d.detail : '入力内容を確認してください。', true);
    fillSettings(d); settingsLoaded = true; mapDirty = true;       // 次に職業探索マップを開いた時は再分析
    showMsg('保存しました。新しい設定は次に選ばれるカードに反映されます。');
  } catch (e) { showMsg('保存できませんでした。', true); }
};
document.getElementById('navSettings').onclick = () => setTab('settings');

let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderMap, 150); });

function newBatch() {                                      // 新しい1バッチ(最大10件)を取得して最初から
  fetch('/api/careers').then(r => r.json()).then(d => { careers = d; idx = 0; liked = []; render(); });
}
newBatch();
</script>
